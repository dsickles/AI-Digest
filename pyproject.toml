[project]
name = "aidigest"
version = "0.1.0"
description = "Personal weekly AI digest pipeline (RSS → SQLite → Gemini → HTML)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "feedparser>=6.0.12,<7",
    "youtube-transcript-api>=1.2.4,<2",
    "google-genai>=2.5.0,<3",
    "httpx>=0.28.1,<0.29",
    "tenacity>=9.1.4,<10",
    "pydantic>=2.13.4,<3",
    "structlog>=25.5.0,<26",
    "PyYAML>=6.0.3,<7",
    "python-dotenv>=1.2.2,<2",
    "truststore>=0.10.4,<1",
    "trafilatura>=2.0.0,<3",
    "readability-lxml>=0.8.4.1,<0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-httpx>=0.36.0,<1",
    "ruff>=0.15.14,<0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline", "store"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-x -q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
