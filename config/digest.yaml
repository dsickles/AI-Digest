# Runtime knobs for Phase 3 pipeline (D-43, D-51, D-59, D-60).
top_n_briefing: 5

dedup:
  title_fuzzy_threshold: 0.85

pipeline:
  # Hard cap per ISO week (D-B9). Reaching this halts new LLM calls and
  # marks unprocessed canonical items with summary_status='deferred_budget'
  # (LOCKED-01 in-place card). HARD_CAP_USD env var overrides this for
  # CI / operator runs.
  hard_stop_usd: 1.0
  meta_reservation_usd: 0.10

models:
  categorize: gemini-2.5-flash-lite
  rank: gemini-2.5-flash
  rollup: gemini-2.5-flash
