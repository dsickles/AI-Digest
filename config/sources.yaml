# AI Digest source registry — checked into git per INGEST-01.
#
# Phase 1 shipped the three D-01 RSS seeds. Phase 2 reaches the eight-source
# target: 3 Phase-1 RSS (Simon Willison, One Useful Thing, Import AI) plus
# three D-33 RSS publishers (Where's Your Ed At, Ben's Bites, Last Week in AI)
# plus two D-29 YouTube channels (How I AI, Nate B Jones).
#
# Schema (per pipeline.config.SourceConfig — D-36 discriminated union):
#   id            Stable kebab-case identifier (used as items.source_id)
#   type          Adapter type — "rss" (Phase 1) or "youtube" (Phase 2 D-27)
#   url           Feed URL (RSS rows only)
#   channel_id    YouTube UC… channel handle (YouTube rows only — feed URL derived)
#   display_name  Human-readable publisher name shown in the digest
#   tag           Topic hint for later categorization (Phase 3) — not stored on items (D-02)
#   enabled       true → fetched on every run; false → skipped silently
sources:
  - id: simon-willison
    type: rss
    url: https://simonwillison.net/atom/everything/
    display_name: Simon Willison
    tag: technical
    enabled: true
  - id: one-useful-thing
    type: rss
    url: https://www.oneusefulthing.org/feed
    display_name: One Useful Thing
    tag: business
    enabled: true
  - id: import-ai
    type: rss
    url: https://importai.substack.com/feed
    display_name: Import AI
    tag: business
    enabled: true
  - id: where-your-ed-at
    type: rss
    url: https://www.wheresyoured.at/feed
    display_name: Where's Your Ed At
    tag: business
    enabled: true
  - id: bensbites
    type: rss
    url: https://www.bensbites.com/feed
    display_name: Ben's Bites
    tag: business
    enabled: true
  - id: last-week-in-ai
    type: rss
    url: https://lastweekin.ai/feed
    display_name: Last Week in AI
    tag: technical
    enabled: true
  - id: how-i-ai
    type: youtube
    channel_id: UCRYY7IEbkHLH_ScJCu9eWDQ
    display_name: How I AI
    tag: technical
    enabled: true
  - id: nate-b-jones
    type: youtube
    channel_id: UC0C-17n9iuUQPylguM1d-lQ
    display_name: AI News & Strategy Daily | Nate B Jones
    tag: business
    enabled: true
