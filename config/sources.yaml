# AI Digest source registry — checked into git per INGEST-01.
#
# Phase 1 shipped the three D-01 RSS seeds. Phase 2 reaches the eight-source
# target: 3 Phase-1 RSS (Simon Willison, One Useful Thing, Import AI) plus
# three D-33 RSS publishers (Where's Your Ed At, Ben's Bites, Last Week in AI)
# plus two D-29 YouTube channels (How I AI, Nate B Jones).
#
# Schema (per pipeline.config.SourceConfig — D-36 discriminated union):
#   id            Stable kebab-case identifier (used as items.source_id)
#   type          Adapter type — "rss" (Phase 1) or "youtube" (Phase 2 D-27)
#   url           Feed URL (RSS rows only)
#   channel_id    YouTube UC… channel handle (YouTube rows only — feed URL derived)
#   channel_url   Optional friendly /@handle URL for the publisher badge link
#                 (YouTube rows; falls back to /channel/UC… if omitted)
#   home_url      Optional explicit publisher home URL (RSS rows; falls back to
#                 canonical_url origin in the renderer if omitted)
#   display_name  Human-readable publisher name shown in the digest
#   tag           Section id: edtech, business, technical, or policy-and-safety.
#                 edtech and policy-and-safety are the card category. A week file
#                 must use that category for those sources.
#   ai_only       Optional. When true, an item that is not about AI stays out of a digest.
#   enabled       true → fetched on every run; false → skipped silently
sources:
  - id: simon-willison
    type: rss
    url: https://simonwillison.net/atom/everything/
    display_name: Simon Willison
    tag: technical
    enabled: true
