# and a primary-sources group. joshua_saxe is still unchecked and stays disabled until it is.
#
# stance is about the section's main debate:
#   business:          booster = expects big near-term AI returns; skeptic = doubts the payoff or the spending
#   technical:         booster = expects fast capability gains from current methods; skeptic = doubts that
#   edtech:            booster = pushes AI into schools now; skeptic = wants evidence first or warns of harm
#   policy-and-safety: booster = favors moving fast with light-touch rules; skeptic = doubts lab safety
#                      claims and wants stronger outside checks; neutral = evaluators and analysts
#   primary-sources:   always neutral; labs and government bodies, not people
#   builders:          booster = all-in on AI tools; skeptic = calls out hype and missing evals

