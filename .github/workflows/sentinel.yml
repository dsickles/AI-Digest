name: Weekly sentinel

# Monday verification that Sunday's digest landed and the spend cap was
# not hit (D-B7, OBS-03). Pings HEALTHCHECK_SENTINEL_URL on pass/fail.

on:
  workflow_dispatch:
  schedule:
    # Monday 12:00 UTC (~08:00 ET).
    - cron: "0 12 * * 1"

permissions:
  contents: read

concurrency:
  group: weekly-sentinel
  cancel-in-progress: false

jobs:
  sentinel:
    name: Verify prior week digest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HEALTHCHECK_SENTINEL_URL: ${{ secrets.HEALTHCHECK_SENTINEL_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install Python and project dependencies
        run: uv sync --frozen

      - name: Resolve prior digest week id
        id: resolve_week
        run: |
          PRIOR_WEEK_ID="$(uv run python -c 'from pipeline.week import active_digest_week_id; print(active_digest_week_id())')"
          echo "Resolved prior digest week_id: ${PRIOR_WEEK_ID}"
          echo "prior_week_id=${PRIOR_WEEK_ID}" >> "$GITHUB_OUTPUT"

      - name: Verify digest and report health
        id: verify
        env:
          PRIOR_WEEK_ID: ${{ steps.resolve_week.outputs.prior_week_id }}
        run: |
          set -euo pipefail
          DIGEST="web/src/content/digests/${PRIOR_WEEK_ID}.json"
          REPORT="web/src/content/reports/${PRIOR_WEEK_ID}.json"

          if [ ! -f "${DIGEST}" ]; then
            echo "reason=missing digest ${DIGEST}" >> "$GITHUB_OUTPUT"
            echo "Digest JSON missing for ${PRIOR_WEEK_ID}."
            exit 1
          fi

          if [ ! -f "${REPORT}" ]; then
            echo "reason=missing report ${REPORT}" >> "$GITHUB_OUTPUT"
            echo "Report JSON missing for ${PRIOR_WEEK_ID}."
            exit 1
          fi

          HARD_CAP_HIT="$(uv run python -c "
          import json
          from pathlib import Path
          data = json.loads(Path('${REPORT}').read_text())
          print('true' if data.get('budget', {}).get('hard_cap_hit') else 'false')
          ")"

          if [ "${HARD_CAP_HIT}" = "true" ]; then
            echo "reason=hard_cap_hit for ${PRIOR_WEEK_ID}" >> "$GITHUB_OUTPUT"
            echo "Spend cap was hit for ${PRIOR_WEEK_ID}."
            exit 1
          fi

          echo "Digest and report OK for ${PRIOR_WEEK_ID}."

      - name: Ping heartbeat success
        if: success()
        run: curl -fsS -m 10 --retry 3 "${HEALTHCHECK_SENTINEL_URL}"

      - name: Ping heartbeat failure
        if: failure()
        env:
          REASON: ${{ steps.verify.outputs.reason }}
        run: |
          BODY="${REASON:-sentinel verification failed}"
          curl -fsS -m 10 --retry 3 --data-raw "${BODY}" "${HEALTHCHECK_SENTINEL_URL}/fail"
