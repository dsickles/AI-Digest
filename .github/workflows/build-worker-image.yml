name: Build worker image

# Multi-arch publish for the residential-IP home worker (D-B5a, OPS-01).
# Registry host comes from the default container registry for GITHUB_TOKEN —
# not hardcoded in operator docs (Privacy Sweep).

on:
  push:
    paths:
      - "worker/**"
      - ".github/workflows/build-worker-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and push aidigest-worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: worker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/aidigest-worker:latest
            ghcr.io/${{ github.repository_owner }}/aidigest-worker:sha-${{ github.sha }}
